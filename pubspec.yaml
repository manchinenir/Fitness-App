name: flex_facility_app
description: A gym management app for admins and clients.
publish_to: 'none'
version: 1.0.30+31

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^0.13.5
  flutter_launcher_icons: ^0.13.1
  font_awesome_flutter: ^10.4.0
  table_calendar: ^3.0.9
  cloud_functions: ^5.5.1
  pdf: ^3.10.4
  printing: ^5.12.0
  url_launcher: ^6.2.5
  flutter_pdfview: ^1.3.0
  share_plus: ^7.2.1
  csv: ^5.0.1
  path_provider: ^2.0.11
  open_file: ^3.5.10
  webview_flutter: ^4.13.0
  clipboard: ^0.1.3
  square_in_app_payments: ^1.7.9

  # Firebase core packages
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  firebase_messaging: ^15.2.6
  flutter_local_notifications: ^18.0.1
  cloud_firestore: ^5.6.8
  firebase_storage: ^12.4.6

  # Local storage
  shared_preferences: ^2.2.2

  # Utility & UI
  provider: ^6.1.2
  fluttertoast: ^8.2.4
  uuid: ^4.2.2
  intl: ^0.19.0
  image_picker: ^1.0.4
  file_picker: ^10.2.0

  # Video & image dependencies
  chewie: ^1.7.5
  video_player: ^2.8.6
  cached_network_image: ^3.3.1

  # Face ID / Touch ID
  local_auth: ^2.2.0

  # Secure storage
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  fl_chart: ^0.63.0
  percent_indicator: ^4.2.2
  flutter_native_splash: ^2.3.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/flex_login/logo.png

flutter_native_splash:
  color: "#1C2D5E"
  image: assets/splash_logo.png
  android: true
  ios: true
  fullscreen: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"