<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Updated - Flex Facility</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #111827;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(15, 23, 42, 0.10);
      max-width: 460px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      background: #dcfce7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    h1 {
      color: #1C2D5E;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    p {
      color: #4b5563;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 14px;
    }
    .note {
      font-size: 13px;
      color: #6b7280;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="36" height="36">
        <path d="M20 6L9 17l-5-5"/>
      </svg>
    </div>

    <h1>Password Updated</h1>
    <p>Your password has been updated successfully.</p>
    <p class="note">Please close this page and log in from the Flex Facility app.</p>
  </div>

  <script>
    // Attempts to close if opened as a popup/tab by script; otherwise browser ignores it.
    try { window.close(); } catch (_) {}
  </script>
</body>
</html>
