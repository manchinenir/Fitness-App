<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Verified – Flex Facility</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(15,23,42,0.10);
      max-width: 440px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      background: #dcfce7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .icon svg { width: 36px; height: 36px; }
    h1 {
      color: #1C2D5E;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      color: #4b5563;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .badge {
      display: inline-block;
      background: #eff6ff;
      color: #1C2D5E;
      font-size: 13px;
      font-weight: 600;
      border-radius: 20px;
      padding: 6px 18px;
      margin-bottom: 28px;
      letter-spacing: 0.03em;
    }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"/>
      </svg>
    </div>

    <span class="badge">Flex Facility</span>

    <h1 id="title">Verifying Email...</h1>
    <p id="message">Please wait while we verify your email address.</p>

    <p style="font-size:13px;color:#6b7280;">
      After verification, close this page and log in from the Flex Facility app.
    </p>

    <div class="footer">
      © 2025 Flex Facility · All rights reserved
    </div>
  </div>

  <script>
    (async function verifyEmail() {
      const title = document.getElementById('title');
      const message = document.getElementById('message');

      const params = new URLSearchParams(window.location.search);
      const mode = params.get('mode');
      const oobCode = params.get('oobCode');
      const apiKey = params.get('apiKey');

      if (mode !== 'verifyEmail' || !oobCode || !apiKey) {
        title.textContent = 'Invalid Verification Link';
        message.textContent = 'This verification link is invalid. Please request a new one from the app.';
        return;
      }

      try {
        const response = await fetch(
          'https://identitytoolkit.googleapis.com/v1/accounts:update?key=' + encodeURIComponent(apiKey),
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ oobCode: oobCode })
          }
        );

        if (!response.ok) {
          let code = 'UNKNOWN';
          try {
            const data = await response.json();
            code = data && data.error && data.error.message ? data.error.message : 'UNKNOWN';
          } catch (_) {}

          if (code === 'INVALID_OOB_CODE' || code === 'EXPIRED_OOB_CODE') {
            title.textContent = 'Link Expired';
            message.textContent = 'This verification link is expired or invalid. Please request a new verification email.';
            return;
          }

          title.textContent = 'Verification Failed';
          message.textContent = 'We could not verify your email right now. Please try again later.';
          return;
        }

        title.textContent = 'Email Verified';
        message.textContent = 'Your email is verified. Please close this page and log in in the Flex Facility app.';
      } catch (_) {
        title.textContent = 'Verification Failed';
        message.textContent = 'We could not verify your email right now. Please try again later.';
      }
    })();
  </script>
</body>
</html>
